<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Space Invaders - Menu</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <section id="main-menu">
        <h1>SPACE INVADERS</h1>
        <div class="tasti-menu">
            <button class="menu-button" id="nome-input" type="button">Nome giocatore</button>
            <input id="player-name" class="menu-input" type="text" placeholder="Inserisci il tuo nome" value="Player 1">
        </div>
        <button class="menu-button" id="gioca-button" type="button">Gioca</button>
        <button class="menu-button" id="classifica-button" type="button">Classifica</button>
        <button class="menu-button" id="exit-button" type="button">Esci</button>
    </section>

    <div id="leaderboard-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>CLASSIFICA</h2>
            <ul id="leaderboard-list"></ul>
            <button class="menu-button" id="close-leaderboard">Chiudi</button>
        </div>
    </div>

    <script>
        // Gestione avvio gioco e salvataggio nome
        document.getElementById('gioca-button').addEventListener('click', () => {
            let name = document.getElementById('player-name').value.trim();
            if(!name) name = "Anonimo";
            sessionStorage.setItem('currentPlayer', name);
            window.location.href = './game.html';
        });

        // Mostra la classifica
        document.getElementById('classifica-button').addEventListener('click', () => {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            // Recupera i punteggi da localStorage
            let leaderboard = JSON.parse(localStorage.getItem('space_invaders_leaderboard')) || [];
            
            // Ordina dal punteggio più alto
            leaderboard.sort((a, b) => b.score - a.score);

            if(leaderboard.length === 0) {
                list.innerHTML = '<li>Nessun record</li>';
            } else {
                leaderboard.slice(0, 10).forEach((entry, index) => {
                    let li = document.createElement('li');
                    li.textContent = `${index + 1}. ${entry.name} - ${entry.score} PT`;
                    list.appendChild(li);
                });
            }
            document.getElementById('leaderboard-modal').style.display = 'flex';
        });

        // Chiudi la classifica
        document.getElementById('close-leaderboard').addEventListener('click', () => {
            document.getElementById('leaderboard-modal').style.display = 'none';
        });

        // Tasto esci
        document.getElementById('exit-button').addEventListener('click', () => {
            if(confirm("Vuoi davvero uscire?")) {
                window.close();
            }
        });
    </script>
</body>
</html>
